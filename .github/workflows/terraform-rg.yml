name: Terraform Azure RG Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Enviornment/Dev

    steps:

      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "e0ebf626-1d9d-4082-aeb3-8768af452de0",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "0b430b86-4372-414d-a228-fbc54442f4eb",
              "tenantId": "34c53e50-2ff5-4db4-b6f7-e8056c5ff6c2"
            }

      # 4. Check Azure Login
      - name: Azure Account
        run: az account show

      # 5. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 6. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 7. Terraform Plan
      - name: Terraform Plan
        run: terraform plan
          

      # 8. Terraform Apply
    #   - name: Terraform Apply
    #     run: |
    #       terraform apply \
    #         -var="subscription_id=0b430b86-4372-414d-a228-fbc54442f4eb" \
    #         -auto-approve